name = "tg-cnc-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "tg-cnc-db"
database_id = "62052485-02be-41a4-9deb-92c23be68bca"

[vars]
ALLOWED_ORIGIN = "https://molodoyromantik.github.io"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

# Tighter, per-user limit on the AI tutor endpoint specifically — that one calls a paid API,
# a plain flood limit isn't enough cost protection on its own.
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 6
  period = 60

# Separate worker + D1 database for trying out changes (schema, logic) without touching real
# user data. Deploy with `npm run deploy:staging`, migrate with `npm run db:migrate:staging`.
[env.staging]
name = "tg-cnc-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "tg-cnc-db-staging"
database_id = "5b9babd1-8d4b-40ad-8eb5-3cacc92e3525"

[env.staging.vars]
ALLOWED_ORIGIN = "https://molodoyromantik.github.io"

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"

  [env.staging.ratelimits.simple]
  limit = 60
  period = 60

[[env.staging.ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1004"

  [env.staging.ratelimits.simple]
  limit = 6
  period = 60
